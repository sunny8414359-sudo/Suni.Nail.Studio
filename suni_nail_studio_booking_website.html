<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Suni Nail Studio｜森妮美甲工作室</title>

  <!-- ⭐ 手機優化版本（重點調整在這） -->
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Noto Sans TC", "PingFang TC", sans-serif;
      color: #3f382f;
      background: #faf7f2;
      line-height: 1.6;
    }

    .hero {
      min-height: 80vh; /* 手機縮短 */
      background:
        linear-gradient(rgba(50,45,38,0.5), rgba(50,45,38,0.5)),
        url("https://images.unsplash.com/photo-1515377905703-c4788e51af15?auto=format&fit=crop&w=1800&q=80") center/cover;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
      color: white;
    }

    .hero h1 {
      font-size: 28px; /* 原本太大，縮小 */
      line-height: 1.3;
    }

    .hero h2 {
      font-size: 20px;
      margin: 8px 0;
    }

    .hero p {
      font-size: 14px;
      margin: 10px 0;
    }

    .btn {
      font-size: 14px;
      padding: 10px 20px;
      border-radius: 999px;
      border: 1px solid white;
      display: inline-block;
      margin-top: 10px;
    }

    section {
      padding: 40px 16px; /* 手機左右縮小 */
    }

    h2 {
      font-size: 22px;
      margin-bottom: 16px;
    }

    h3 {
      font-size: 16px;
      margin: 16px 0 10px;
    }

    .option-grid {
      display: grid;
      grid-template-columns: 1fr 1fr; /* 手機改兩欄 */
      gap: 10px;
    }

    .option {
      padding: 10px;
      font-size: 13px; /* 手機字體縮小 */
      border: 1px solid #ccc;
      border-radius: 10px;
      text-align: center;
    }

    .option.selected {
      background: #bda484;
      color: white;
    }

    input {
      width: 100%;
      padding: 10px;
      margin-top: 8px;
      border-radius: 10px;
      border: 1px solid #ccc;
      font-size: 14px;
    }

    button {
      width: 100%;
      padding: 12px;
      margin-top: 16px;
      font-size: 14px;
      border-radius: 999px;
      border: none;
      background: #9d8466;
      color: white;
    }

    .modal-content {
      width: 90%;
      padding: 16px;
      font-size: 14px;
    }

    @media (min-width: 768px) {
      /* 電腦版維持比較大 */
      .hero h1 { font-size: 60px; }
      .hero h2 { font-size: 36px; }
      .hero p { font-size: 18px; }

      .option-grid {
        grid-template-columns: repeat(3, 1fr);
      }

      section {
        padding: 80px 8%;
      }
    }
  </style>
</head>
<body>

  <header class="hero">
    <div>
      <h1>Suni Nail Studio</h1>
      <h2>森妮美甲工作室</h2>
      <p>指尖的溫柔，收藏每一個心動瞬間</p>
      <a class="btn" href="#booking">立即預約</a>
    </div>
  </header>

  <section id="booking">
    <h2>線上預約</h2>

    <h3>1. 選擇服務</h3>
    <div class="option-grid" data-name="service">
      <button class="option">手部單色</button>
      <button class="option">手部貓眼</button>
      <button class="option">手部漸層</button>
      <button class="option">手部簡單款</button>
      <button class="option">基礎保養</button>
      <button class="option">純卸甲</button>
    </div>

    <h3>2. 卸甲服務</h3>
    <div class="option-grid" data-name="removal">
      <button class="option">本店卸甲續作</button>
      <button class="option">他店卸甲續作</button>
      <button class="option">不需卸甲</button>
      <button class="option">本店卸甲不續作</button>
      <button class="option">他店卸甲不續作</button>
    </div>

    <h3>3. 美甲師</h3>
    <div class="option-grid" data-name="artist">
      <button class="option">Suni</button>
    </div>

    <h3>4. 日期</h3>
    <input type="date" id="date" />
    <p style="font-size:12px;">※需提前兩天預約</p>

    <h3>5. 時段</h3>
    <div class="option-grid" data-name="time">
      <button class="option">10:30</button>
      <button class="option">11:30</button>
      <button class="option">13:30</button>
      <button class="option">14:30</button>
      <button class="option">15:30</button>
      <button class="option">16:30</button>
      <button class="option">17:30</button>
      <button class="option">18:30</button>
    </div>

    <h3>6. 聯絡資訊</h3>
    <input type="text" id="name" placeholder="姓名" />
    <input type="tel" id="phone" placeholder="電話" />

    <button onclick="confirmBooking()">確認預約並前往LINE</button>
  </section>

</body>
</html>
